# ĐC-10: giữ nguyên điều kiện NGOẠI LỆ xuất hóa đơn của mô hình ăn uống trực tiếp
# -----------------------------------------------------------------------------
legal_hoa_don_dien_tu:
  - "Doanh nghiệp ăn uống trực tiếp: dùng hóa đơn điện tử khởi tạo từ máy tính tiền kết nối dữ liệu với cơ quan thuế — TRỪ trường hợp thuộc diện NGOẠI LỆ theo quy định tại Nghị định 254/2026/NĐ-CP"
  - "Hộ kinh doanh doanh thu > 1 tỷ đồng/năm: bắt buộc hóa đơn điện tử có mã của cơ quan thuế hoặc hóa đơn điện tử khởi tạo từ máy tính tiền (NĐ 141/2026/NĐ-CP, NĐ 254/2026/NĐ-CP)"
  - "Hộ kinh doanh doanh thu ≤ 1 tỷ đồng/năm: có thể đăng ký nếu đủ điều kiện và có nhu cầu"
