meta:
  schema_version: "1.0"
  category: equipment_spec
  updated_at: 2026-11-25

nau_ham:
  - name: "Nồi trụng phở (nhỏ)"
    capacity_liter: { min: 20, max: 30 }
    material: "Inox 304"
  - name: "Nồi nước dùng"
    capacity_liter: { min: 50, max: 100 }
    material: "Inox 304"
  - name: "Nồi hầm xương"
    capacity_liter:
      min: 100
      recommended_max: 200             # 200L+ cho quy mô lớn — gợi ý, KHÔNG khóa cứng trần (ĐC-09)
    material: "Inox 304"
  - name: "Nồi hầm xương điện (chuẩn — Newsun 100L)"
    capacity_liter: 100
    cong_suat_max_kw: 6
    material: "Inox 304"
    ghi_chu: "Mẻ chuẩn 20kg xương bò + 5kg xương heo + 100L nước → 70L thành phẩm (xem recipe-nuoc-dung-pho-bo.yaml)"
  - name: "Sọt xương / giỏ trụng phở"
    purpose: "Giữ xương gọn khi hầm, trụng bánh phở & rau nhanh"

so_che:
  - "Máy cưa xương: cắt xương ống/xương bò đều, nhanh (quy mô vừa–lớn)"
  - "Máy thái thịt bò: tái/nạm/gầu lát mỏng đều (kết hợp máy xay thịt/giò nếu tự làm bò viên)"
  - "Bàn chặt inox, thớt dày, dao sắc: chặt xương, thái thịt, sơ chế hành/gừng/rau thơm"
  - "Rổ rá, rây lọc, vá/muỗng múc, khay: hớt bọt, lọc cặn, chia nguyên liệu"

bao_quan:
  - "Tủ đông: trữ xương bò, thịt bò dự trữ dài ngày (≤ -18°C — xem storage-preservation.yaml)"
  - "Tủ mát / tủ mát bàn chặt: thịt tươi trong ngày, rau sống, hành lá, gia vị (thịt sống 0–3°C, thịt chín 2–4°C)"
  - "Tủ kính trưng bày: thịt chín/tái, bò viên, rau tại quầy bán"

rua_hut_mui:
  - "Chậu rửa công nghiệp inox 2–3 ngăn + kệ inox (rửa xương, nguyên liệu, bát đĩa, để ráo)"
  - "Chụp hút khói, quạt hút, đường ống hút mùi (giảm hơi nóng, mùi nước dùng, khói)"
  - "Máng thoát sàn + bể tách mỡ inox (hạn chế đọng nước trơn, chống tắc mỡ bò)"

pos_printer:
  - quy_mo_nho: "Máy POS cầm tay / máy tính bảng + máy in hóa đơn nhiệt"
  - quy_mo_vua_lon: "Máy POS cảm ứng + máy in hóa đơn + máy in bếp (nếu tách quầy) + ngăn kéo đựng tiền"
  - printer_width_mm: [58, 80]
  - note: "Ưu tiên thiết bị gọn nhẹ, chịu nhiệt/độ ẩm tốt quanh khu nấu, dễ thao tác khi tay ướt"

