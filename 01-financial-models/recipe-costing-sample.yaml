# =============================================================================
# RECIPE COSTING — Phở Bò Tái Nạm (1 bát)
# File mẫu cho 01-financial-models.
#
# Mục đích: mô phỏng cách tính GIÁ VỐN (Food Cost) cho 1 bát.
# v0.4.0 — phân bổ xương theo MẺ THỰC ĐO (25 kg xương / 140 tô), thay ước tính cũ:
#   - xương: 25 kg × 60.000 VND/kg ÷ 140 tô = 10.714 VND/tô (trước đây ước 6.000đ)
#   - điện năng: ~32 kWh/mẻ ÷ 140 tô = 0.229 kWh/tô (giá điện là biến TBD)
#   - tỷ lệ hao hụt khi LUỘC THỊT (nạm) => yield_factor = 0.68
#
# Nguyên tắc: mọi định lượng, đơn giá, hệ số hao hụt đều là BIẾN SỐ riêng
# để đội ngũ lập trình chuyển thẳng thành code/database (bảng recipe, bảng
# ingredient, bảng cost). Không nhét số chết vào mô tả.
# =============================================================================

meta:
  recipe_id: PHO-BO-TAI-NAM-001
  recipe_name: "Phở Bò Tái Nạm"
  serving_unit: bat                 # đơn vị tính: 1 bát
  servings_per_recipe: 1
  currency: VND
  price_selling: 45000              # giá bán 1 bát (VND)
  target_food_cost_percent: 0.38    # mục tiêu food cost 38% (chuẩn món phở)
  updated_at: 2026-11-25
  notes: >
    Giá nguyên liệu là giá tham khảo (nhập sỉ thị trường VN). Phải cập nhật
    theo giá nhập thực tế từng tuần — đây là biến số, không phải hằng số.

# -----------------------------------------------------------------------------
# BIẾN SỐ — HỆ SỐ HAO HỤT / THU HỒI SAU SƠ CHẾ (yield_factor)
# yield_factor = khối lượng thu được sau sơ chế / khối lượng mua vào.
# hao hụt % = (1 - yield_factor) * 100
# -----------------------------------------------------------------------------
variables:
  yield:
    bo_nam_luoc: 0.68    # nạm bò luộc chín còn ~68% khối lượng sống (hao hụt 32%)
    rau_thom_soche: 0.85 # rau thơm, giá đỗ sau nhặt/bỏ gốc còn ~85%
    # v0.4.0: xương KHÔNG dùng hệ số 0.45 nữa — phân bổ theo mẻ thực đo 25kg/140 tô
    # (xem xuong_cost_allocation trong recipe-nuoc-dung-pho-bo.yaml)
  portion:               # định lượng chuẩn cho 1 bát
    banh_pho_gram: 200
    bo_tai_gram: 40
    nam_chin_gram: 34    # nạm CHÍN trên bát (khối lượng sau luộc)

# -----------------------------------------------------------------------------
# NGUYÊN LIỆU & GIÁ VỐN
#   qty_raw_per_serving_gram : lượng nguyên liệu THÔ (mua vào) cần cho 1 bát
#   cost_per_serving         : giá vốn phân bổ cho 1 bát
#
# Lưu ý nạm bò: trên bát cần 34g chín => thô = 34 / 0.68 = 50g.
# Lưu ý xương (v0.4.0): 25 kg xương/mẻ ÷ 140 tô = 178.6g/tô => 178.6 × 60.000/1000 = 10.714đ.
# -----------------------------------------------------------------------------
ingredients:
  - name: "Bánh phở"
    unit: kg
    price_per_unit: 16000
    yield_factor: 1.0                 # dùng trực tiếp, không hao hụt sơ chế
    qty_raw_per_serving_gram: 200
    cost_per_serving: 3200            # 0.2 * 16000

  - name: "Thịt bò tái (thăn)"
    unit: kg
    price_per_unit: 150000
    yield_factor: 1.0                 # thái sống, không hao hụt
    qty_raw_per_serving_gram: 40
    cost_per_serving: 6000            # 0.04 * 150000

  - name: "Nạm bò"
    unit: kg
    price_per_unit: 130000
    yield_factor: 0.68                # hao hụt khi luộc 32%
    qty_raw_per_serving_gram: 50      # 34g chín / 0.68
    cost_per_serving: 6500            # 0.05 * 130000

  - name: "Xương bò (hầm nước dùng)"
    unit: kg
    price_per_unit: 60000
    yield_factor: 1.0                 # v0.4.0: toàn bộ 25kg mua vào phân bổ 100% chi phí vào nước dùng (bã là phế phẩm đã trả tiền)
    qty_raw_per_serving_gram: 179     # 25,000g / 140 tô ≈ 178.6g
    cost_per_serving: 10714           # 25kg × 60000 / 140 tô

  - name: "Điện năng ninh (nồi Newsun 100L)"
    unit: kWh
    price_per_unit: TBD_OWNER_INPUT   # electricity_unit_price (VND/kWh) — bậc giá điện kinh doanh khu vực
    yield_factor: 1.0
    qty_raw_per_serving_kwh: 0.229    # 32 kWh / 140 tô ≈ 0.2286
    cost_per_serving: TBD_OWNER_INPUT # = 0.2286 × electricity_unit_price

  - name: "Gia vị nước dùng (gừng, hành, hồi, quế, thảo quả, mắm, muối)"
    unit: batch
    price_per_unit: 0
    yield_factor: 1.0
    qty_raw_per_serving_gram: 0
    cost_per_serving: 2000            # phân bổ theo mẻ nước dùng

  - name: "Hành lá, rau thơm, giá đỗ"
    unit: batch
    price_per_unit: 0
    yield_factor: 0.85                # hao hụt sơ chế rau 15%
    qty_raw_per_serving_gram: 0
    cost_per_serving: 1200

  - name: "Chanh, ớt, tương, thìa đũa"
    unit: batch
    price_per_unit: 0
    yield_factor: 1.0
    qty_raw_per_serving_gram: 0
    cost_per_serving: 800

# -----------------------------------------------------------------------------
# KẾT QUẢ (tổng hợp)
# -----------------------------------------------------------------------------
summary:
  total_food_cost_nguyen_lieu: 30414  # 3200+6000+6500+10714+2000+1200+800 (CHƯA gồm điện năng)
  electricity_cost_per_serving: TBD_OWNER_INPUT
  price_selling: 45000
  food_cost_percent_nguyen_lieu: 0.676 # 30414 / 45000 = 67.6% (chưa gồm điện)
  gross_margin_nguyen_lieu: 14586      # 45000 - 30414
  gross_margin_percent_nguyen_lieu: 0.324
  vs_target: >
    Food cost nguyên liệu 67.6% (chưa gồm điện) — CAO hơn mục tiêu 38% và trần
    món chủ lực 42–45%. Nguyên nhân chính: xương thực tế 10.714đ/tô (gần gấp đôi
    ước tính cũ 6.000đ — v0.4.0 phân bổ 25kg/140 tô). Cần tối ưu bằng một trong
    các đòn bẩy: tăng giá bán, giảm định lượng bò tái/nạm, đàm phán giá xương/thịt
    sỉ, hoặc dùng phần thịt rẻ hơn (gầu, bắp). Điện năng (~0.23 kWh/tô) cộng thêm
    tùy giá điện. Tính lại ở file khác khi thay biến — KHÔNG sửa số chết.
