# =============================================================================
# RECIPE COSTING — Phở Bò Tái Chín (1 bát)
# File mẫu cho 01-financial-models.
#
# Mục đích: mô phỏng cách tính GIÁ VỐN (Food Cost) cho 1 bát.
# v1.1.0 — đồng bộ công thức chi tiết của chủ quán:
#   - Định lượng thịt ra tô chuẩn mới: tái 60g + chín (nạm) 40g/tô.
#   - Xương: 20 kg xương bò + 5 kg xương heo (tổng 25 kg) ÷ 140 tô.
#   - Thay ước tính "gia vị 2.000đ/tô" bằng phép phân bổ chính xác từ nước nèo
#     + tôm khô + đồ thơm 3 lớp chia cho 140 tô (xem recipe-nuoc-dung-pho-bo.yaml).
#   - Giá các nguyên liệu mới là GIÁ THAM KHẢO (nhập sỉ thị trường VN); thay bằng
#     giá nhập thực tế từng tuần — đây là biến số, không phải hằng số. Nguyên liệu
#     chưa có giá chốt (điện, dầu hương vị phân bổ) để TBD_OWNER_INPUT.
#
# Nguyên tắc: mọi định lượng, đơn giá, hệ số hao hụt đều là BIẾN SỐ riêng để đội
# lập trình chuyển thẳng thành code/database. Không nhét số chết vào mô tả.
# =============================================================================

meta:
  recipe_id: PHO-BO-TAI-CHIN-001
  recipe_name: "Phở Bò Tái Chín"
  serving_unit: bat                 # đơn vị tính: 1 bát
  servings_per_recipe: 1
  currency: VND
  price_selling: 45000              # giá bán 1 bát (VND)
  target_food_cost_percent: 0.38    # mục tiêu food cost 38% (chuẩn món phở)
  updated_at: 2026-11-25
  notes: >
    Giá nguyên liệu là giá THAM KHẢO (nhập sỉ thị trường VN). Phải cập nhật theo
    giá nhập thực tế từng tuần — đây là biến số, không phải hằng số. v1.1.1: điện
    năng (3.000đ/kWh) và dầu hương vị (1L/mẻ 100L) đã được phân bổ vào tổng giá vốn.

# -----------------------------------------------------------------------------
# BIẾN SỐ — HỆ SỐ HAO HỤT / THU HỒI SAU SƠ CHẾ (yield_factor)
# yield_factor = khối lượng thu được sau sơ chế / khối lượng mua vào.
# hao hụt % = (1 - yield_factor) * 100
# -----------------------------------------------------------------------------
variables:
  yield:
    bo_nam_luoc: 0.68    # nạm bò luộc chín còn ~68% khối lượng sống (hao hụt 32%)
    rau_thom_soche: 0.85 # rau thơm, giá đỗ sau nhặt/bỏ gốc còn ~85%
  portion:               # định lượng chuẩn cho 1 bát (v1.1.0)
    banh_pho_gram: 200
    bo_tai_gram: 60      # v1.1.0: tái 60g/tô
    nam_chin_gram: 40    # v1.1.0: chín (nạm) 40g/tô — khối lượng CHÍN trên bát

# -----------------------------------------------------------------------------
# NGUYÊN LIỆU & GIÁ VỐN
#   qty_raw_per_serving_gram : lượng nguyên liệu THÔ (mua vào) cần cho 1 bát
#   cost_per_serving         : giá vốn phân bổ cho 1 bát
#
# Nạm bò: trên bát cần 40g chín => thô = 40 / 0.68 = 58.8g.
# Xương (v1.1.0): 20kg bò + 5kg heo ÷ 140 tô; bò = 142.9g/tô, heo = 35.7g/tô.
# -----------------------------------------------------------------------------
ingredients:
  # --- Trên bát (trực tiếp) ---
  - name: "Bánh phở"
    unit: kg
    price_per_unit: 16000           # giá tham khảo
    yield_factor: 1.0
    qty_raw_per_serving_gram: 200
    cost_per_serving: 3200          # 0.2 * 16000

  - name: "Thịt bò tái (thăn)"
    unit: kg
    price_per_unit: 150000          # giá tham khảo
    yield_factor: 1.0
    qty_raw_per_serving_gram: 60    # v1.1.0: 60g/tô
    cost_per_serving: 9000          # 0.06 * 150000

  - name: "Nạm bò (chín)"
    unit: kg
    price_per_unit: 130000          # giá tham khảo
    yield_factor: 0.68
    qty_raw_per_serving_gram: 58.8  # 40g chín / 0.68
    cost_per_serving: 7647          # 0.0588 * 130000

  # --- Nước dùng (phân bổ ÷ 140 tô) ---
  - name: "Xương bò (hầm nước dùng)"
    unit: kg
    price_per_unit: 60000           # giá tham khảo
    yield_factor: 1.0
    qty_raw_per_serving_gram: 142.9 # 20,000g / 140 tô
    cost_per_serving: 8571          # 20kg × 60000 / 140

  - name: "Xương heo (hầm nước dùng)"
    unit: kg
    price_per_unit: 30000           # giá tham khảo (ống/cục heo)
    yield_factor: 1.0
    qty_raw_per_serving_gram: 35.7  # 5,000g / 140 tô
    cost_per_serving: 1071          # 5kg × 30000 / 140

  - name: "Điện năng ninh (nồi Newsun 100L)"
    unit: kWh
    price_per_unit: 3000            # đơn giá điện kinh doanh ~3.000đ/kWh (tham khảo)
    yield_factor: 1.0
    qty_raw_per_serving_kwh: 0.229  # 32 kWh / 140 tô
    cost_per_serving: 686           # 32 kWh × 3.000đ ÷ 140 tô = 685,7đ

  # --- Cốt ngọt + đồ thơm 3 lớp + nước nèo (thay ước tính 2.000đ cũ) ---
  - name: "Tôm khô (cốt ngọt)"
    unit: kg
    price_per_unit: 180000          # giá tham khảo
    yield_factor: 1.0
    qty_raw_per_serving_gram: 4.29  # 600g / 140 tô
    cost_per_serving: 771           # 0.6 × 180000 / 140

  - name: "Gừng (tươi + nướng + chưng)"
    unit: kg
    price_per_unit: 40000           # giá tham khảo
    yield_factor: 1.0
    qty_raw_per_serving_gram: 14.29 # 2,000g (1kg cốt ngọt + 500 nướng + 300 tươi + 200 chưng) / 140
    cost_per_serving: 571           # 2 × 40000 / 140

  - name: "Hành khô (nướng + chưng)"
    unit: kg
    price_per_unit: 25000           # giá tham khảo
    yield_factor: 1.0
    qty_raw_per_serving_gram: 3.21  # 450g (250 nướng + 200 chưng) / 140
    cost_per_serving: 80            # 0.45 × 25000 / 140

  - name: "Hành tây (nướng)"
    unit: kg
    price_per_unit: 20000           # giá tham khảo
    yield_factor: 1.0
    qty_raw_per_serving_gram: 1.43  # 200g (1 củ) / 140
    cost_per_serving: 29            # 0.2 × 20000 / 140

  - name: "Quế (chưng dầu)"
    unit: kg
    price_per_unit: 120000          # giá tham khảo
    yield_factor: 1.0
    qty_raw_per_serving_gram: 0.71  # 100g / 140
    cost_per_serving: 86            # 0.1 × 120000 / 140

  - name: "Thảo quả (chưng dầu)"
    unit: kg
    price_per_unit: 200000          # giá tham khảo
    yield_factor: 1.0
    qty_raw_per_serving_gram: 0.57  # 80g / 140
    cost_per_serving: 114           # 0.08 × 200000 / 140

  - name: "Nước nèo — mì chính"
    unit: kg
    price_per_unit: 50000           # giá tham khảo
    yield_factor: 1.0
    qty_raw_per_serving_gram: 3.5   # 490g (70g×7) / 140
    cost_per_serving: 175           # 0.49 × 50000 / 140

  - name: "Nước nèo — đường phèn"
    unit: kg
    price_per_unit: 30000           # giá tham khảo
    yield_factor: 1.0
    qty_raw_per_serving_gram: 6.0   # 840g (120g×7) / 140
    cost_per_serving: 180           # 0.84 × 30000 / 140

  - name: "Nước nèo — hạt nêm"
    unit: kg
    price_per_unit: 75000           # giá tham khảo
    yield_factor: 1.0
    qty_raw_per_serving_gram: 2.5   # 350g (50g×7) / 140
    cost_per_serving: 188           # 0.35 × 75000 / 140

  - name: "Nước nèo — muối trắng"
    unit: kg
    price_per_unit: 8000            # giá tham khảo
    yield_factor: 1.0
    qty_raw_per_serving_gram: 2.0   # 280g (40g×7) / 140
    cost_per_serving: 16            # 0.28 × 8000 / 140

  - name: "Nước nèo — nước mắm cốt độ đạm cao"
    unit: kg
    price_per_unit: 80000           # giá tham khảo
    yield_factor: 1.0
    qty_raw_per_serving_gram: 17.5  # 2450g (350g×7) / 140
    cost_per_serving: 1400          # 2.45 × 80000 / 140

  - name: "Dầu hương vị chưng cất (1L/mẻ 100L)"
    unit: lit
    price_per_unit: 65800           # giá 1 L dầu hương vị = tổng mẻ 5L (329.000đ) ÷ 5
    yield_factor: 1.0
    qty_raw_per_serving_lit: 0.00714  # 1 L ÷ 140 tô
    cost_per_serving: 470           # 65.800đ ÷ 140 tô
    ghi_chu: "Mẻ 5L: dầu 5L×40k + gừng 1,5kg×40k + hành tím 900g×25k + tỏi 200g×50k + quế 100g×120k + thảo quả 70g×200k + hoa hồi 70g×150k = 329.000đ"

  # --- Gia vị kèm (giữ nguyên) ---
  - name: "Hành lá, rau thơm, giá đỗ"
    unit: batch
    price_per_unit: 0
    yield_factor: 0.85
    qty_raw_per_serving_gram: 0
    cost_per_serving: 1200

  - name: "Chanh, ớt, tương, thìa đũa"
    unit: batch
    price_per_unit: 0
    yield_factor: 1.0
    qty_raw_per_serving_gram: 0
    cost_per_serving: 800

# -----------------------------------------------------------------------------
# KẾT QUẢ (tổng hợp)
# -----------------------------------------------------------------------------
summary:
  # Tổng theo GIÁ THAM KHẢO (đã gồm điện năng 686đ + dầu hương vị 470đ):
  # 3200 + 9000 + 7647 + 8571 + 1071 + 686 + 771 + 571 + 80 + 29 + 86 + 114
  #   + 175 + 180 + 188 + 16 + 1400 + 470 + 1200 + 800
  total_food_cost_nguyen_lieu: 36255   # giá tham khảo, đã gồm điện năng + dầu hương vị
  electricity_cost_per_serving: 686     # 32 kWh × 3.000đ ÷ 140 tô
  dau_huong_vi_cost_per_serving: 470    # 1L dầu hương vị (65.800đ) ÷ 140 tô
  price_selling: 45000
  food_cost_percent_nguyen_lieu: 0.806  # 36255 / 45000 = 80.6% (giá tham khảo, đầy đủ chi phí)
  gross_margin_nguyen_lieu: 8745        # 45000 - 36255
  gross_margin_percent_nguyen_lieu: 0.194
  vs_target: >
    Food cost nguyên liệu 80.6% (giá tham khảo, đã gồm điện năng + dầu hương vị)
    — CAO hơn nhiều so với mục tiêu 38% và trần món chủ lực 42–45%. Nguyên nhân:
    (1) định lượng thịt tăng (tái 60g, chín 40g) → thịt 16.647đ/tô (37% giá bán);
    (2) xương bò+heo 9.642đ/tô (21%); (3) gia vị/tôm khô/đồ thơm itemized 3.610đ/tô;
    (4) điện năng 686đ + dầu hương vị 470đ. Đây là tín hiệu CHƯA tối ưu — xem
    gia_ban_de_xuat bên dưới để thấy giá bán cần đạt cho food cost 42%.

# -----------------------------------------------------------------------------
# GIÁ BÁN ĐỀ XUẤT ĐẠT CHUẨN FOOD COST (v1.1.1)
# -----------------------------------------------------------------------------
gia_ban_de_xuat:
  cong_thuc: "Gia_ban = total_food_cost_nguyen_lieu / food_cost_target_percent"
  food_cost_target_percent: 0.42     # trần món chủ lực nhiều thịt (ĐC-01)
  gia_ban_hien_tai: 45000
  gia_ban_dat_42_percent: 86321      # 36.255 / 0.42
  chenh_lech_can_tang: 41321         # 86.321 - 45.000
  ghi_chu: >
    Với định lượng thịt hiện tại (tái 60g + chín 40g) và giá tham khảo, muốn đạt
    food cost 42% phải bán ~86.300đ/tô — chênh rất xa so với 45.000đ hiện tại.
    Đòn bẩy ngược lại: giảm định lượng thịt/xương, hoặc đàm phán giá nguyên liệu
    sỉ về mức để food cost nằm trong 42–45% ở mức giá bán mong muốn.
