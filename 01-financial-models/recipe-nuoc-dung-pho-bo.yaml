# =============================================================================
# CÔNG THỨC NINH NƯỚC DÙNG — PHỞ BÒ (MẺ CHUẨN 100L)
# Nguồn: 00-raw-notes/Kinh-nghiem-ninh-xuong.md + công thức chi tiết của chủ quán
# v1.1.0 — bổ sung công thức chi tiết do chủ quán cung cấp:
#   - Xương: 20 kg xương bò + 5 kg xương heo (tổng 25 kg).
#   - Cốt tạo ngọt tự nhiên: 600 g tôm khô + 1.000 g gừng tươi.
#   - Đồ thơm 3 lớp (nướng / tươi / chưng dầu) — định lượng rõ cho mẻ 100L.
#   - Nước nèo chuẩn trên cơ sở 10 L nước dùng (×7 cho 70 L thành phẩm).
#   - Dầu hương vị chưng cất (mẻ 5 L dầu ăn) + kỹ thuật chưng theo thứ tự.
# v0.4.0 — chốt định lượng mẻ chuẩn & điện năng thực đo (nồi Newsun 100L, 6kW).
# Mục đích: tách thông số định lượng (thời gian, nhiệt độ, nguyên liệu, điện) thành
#           biến số để làm cơ sở dữ liệu (bảng recipe, bảng step-timer, bảng cost).
# =============================================================================

meta:
  recipe_id: NUOC-DUNG-PHO-BO-001
  recipe_name: "Nước dùng Phở Bò"
  unit: batch                   # 1 mẻ nước dùng (nồi chuẩn 100L)
  noi_chuan: "Nồi điện Newsun 100L (công suất max 6kW)"
  updated_at: 2026-11-25

ingredients:                    # nguyên liệu làm nước dùng (định lượng chi tiết ở các mục dưới)
  - "Xương bò (ống + lẫn)"
  - "Xương heo (ống/cục)"
  - "Tôm khô"
  - "Gừng tươi"
  - "Hành khô (hành tím)"
  - "Hành tây"
  - "Tỏi"
  - "Quế"
  - "Thảo quả"
  - "Cánh hoa hồi"
  - "Dầu ăn"
  - "Nước mắm cốt độ đạm cao"
  - "Mì chính, hạt nêm, đường phèn, muối trắng"

# -----------------------------------------------------------------------------
# ĐC-08: LUỒNG SƠ CHẾ XƯƠNG DUY NHẤT (khớp chon-xuong-bo.md & ninh-xuong-bo.md)
# -----------------------------------------------------------------------------
prep_flow_xuong:
  - buoc: "Ngâm khử mùi"
    noi_dung: "Chà muối + rượu trắng (hoặc ngâm giấm pha loãng); có thể ngâm nước vỏ chanh 15–20 phút"
  - buoc: "Chần nước sôi rửa sạch"
    noi_dung: "Chần qua nước sôi rồi rửa lại sạch để loại cặn bẩn"
  - buoc: "Nướng thơm xương ống (nếu áp dụng)"
    noi_dung: "Nướng bếp gas/than, nồi chiên không dầu hoặc lò nướng 200–230°C trong 15–20 phút đến cháy xém, chảy mỡ thừa"
  - buoc: "Vào nồi ninh"
    noi_dung: "Rửa lại sạch, cho vào nồi nước, đun vừa để vớt bọt rồi ninh liu riu (xem process bên dưới)"

process:
  - step: 1
    name: "Ngâm khử mùi & chần rửa sạch"
    detail: "Chà muối + rượu trắng (hoặc ngâm giấm pha loãng), có thể ngâm nước vỏ chanh; rồi chần qua nước sôi, rửa lại sạch"
    time_min: { min: 15, max: 20 }
  - step: 2
    name: "Nướng xương"
    detail: "Nướng trên bếp gas/than, nồi chiên không dầu hoặc lò nướng đến cháy xém, chảy mỡ thừa"
    temp_c: { min: 200, max: 230 }
    time_min: { min: 15, max: 20 }
  - step: 3
    name: "Rửa lại & hầm sơ, vớt bọt"
    detail: "Rửa lại sạch, cho xương vào nồi nước, đun nhiệt cao vừa phải để bọt nổi lên, vớt sạch bọt (không để bọt tan vào nước). NGAY SAU KHI vớt sạch bọt đợt đầu thì cho thịt nạm/gầu vào luộc."
  - step: 4
    name: "Ninh xương"
    detail: "Ninh sôi liu riu (mặt nước sôi lăn tăn, không sôi sùng sục); duy trì suốt ~20 tiếng, châm bù bằng nước sôi khi cạn dưới xương."
    time_hour: 20
  - step: 5
    name: "Luộc thịt nạm/gầu (song song trong 20 giờ ninh)"
    detail: "Thịt cho vào ngay sau khi vớt sạch bọt đợt đầu, luộc 2.5–3 giờ đến chín mềm rồi vớt (KHÔNG cộng thêm vào 20 giờ ninh). Làm nguội nhanh FDA §3-501.14: khay nông ≤5cm, 57°C→21°C ≤2h, →≤5°C tổng ≤6h; chia túi/hộp → ngăn đông mềm -1°C..-3°C (tối đa 48h, bán hôm sau) hoặc cấp đông ≤ -18°C (dài ngày)."
    time_hour: { min: 2.5, max: 3 }
  - step: 6
    name: "Làm nước lèo (tạo hương & nêm gia vị)"
    detail: "Dùng hộp gia vị inox: toàn bộ thảo mộc (quế, hồi, thảo quả...) cho vào hộp inox lưới nhúng trong nồi, KHÔNG thả trực tiếp; nhấc hộp ra sau ~45 phút để nước thanh, không nồng/đắng mùi quế hồi. Phối hợp hương liệu 3 lớp (xem huong_lieu). Nêm bằng nước mắm cốt độ đạm cao."
  - step: 7
    name: "Chuẩn bị bán hàng"
    detail: "Chuẩn bị thịt, rau thơm, bánh phở để bán; ra tô chuẩn 500 mL nước dùng/tô (xem 03-sop-operations/ra-to-va-giu-nhiet.md)."

# -----------------------------------------------------------------------------
# ĐỊNH MỨC MẺ CHUẨN (v0.4.0 — số thực đo, thay TBD_OWNER_INPUT cũ)
# -----------------------------------------------------------------------------
batch_spec:
  noi_chuan: "Nồi điện Newsun 100L (công suất max 6kW, dung tích DANH ĐỊNH)"
  kg_xuong_per_me: 25               # tổng 25 kg xương = 20 kg xương bò + 5 kg xương heo
  kg_xuong_bo_per_me: 20            # v1.1.0: 20 kg xương bò (ống + lẫn)
  kg_xuong_heo_per_me: 5            # v1.1.0: 5 kg xương heo (ống/cục)
  the_tich_xuong_chiem_lit: { min: 18, max: 20 }   # 25 kg xương chiếm ~18–20 L thể tích nồi
  lit_nuoc_dau_vao: 100             # tổng nước cấp vào cả mẻ = 100 L (= lit_nuoc_lanh_nap_ban_dau + lit_nuoc_cham_bu)
  lit_nuoc_lanh_nap_ban_dau: { min: 80, max: 85 }  # nước lạnh nạp ban đầu (đến vạch an toàn, chừa chỗ xương + châm bù)
  lit_nuoc_cham_bu: { min: 15, max: 20 }           # châm bù nước SÔI trong quá trình ninh
  lit_thanh_pham_sau_loc: 70        # 70 lít nước dùng bán được sau lọc
  so_to_thanh_pham: 140             # 70 L ÷ 0.5 L/tô = 140 tô chuẩn
  ty_le_xuong_nuoc_ban_dau: 0.25    # 25 kg / 100 L nước đầu vào (định mức mẻ chuẩn) = 0.25 kg xương / lít
  ty_le_xuong_nuoc_tong: 0.25       # 25 kg / tổng nước cấp vào thực tế (100 L = 80–85 L ban đầu + 15–20 L châm bù) = 0.25
  dinh_muc_ml_nuoc_dung_per_to: 500 # 500 mL nước dùng/tô
  gram_xuong_per_to: 178.6          # 25,000 g / 140 tô

# -----------------------------------------------------------------------------
# ĐIỆN NĂNG MẺ NINH (nồi Newsun 100L)
# -----------------------------------------------------------------------------
dien_nang:
  noi: "Nồi điện Newsun 100L — công suất max 6kW"
  kwh_per_batch: 32                 # tổng điện năng ~32 kWh/mẻ ninh 20 giờ
  electricity_unit_price: 3000      # VND/kWh — giá tham khảo ~3.000đ/kWh (thay bằng giá điện kinh doanh thực tế)
  don_vi_gia_dien: "VND/kWh"
  cost_per_batch_vnd: 96000         # 32 kWh × 3.000đ = 96.000đ/mẻ (v1.1.1)
  cost_per_to_vnd: 686              # 96.000đ ÷ 140 tô = 685,7đ (v1.1.1)
  breakdown:
    - giai_doan: "Đun sôi ban đầu (max 6kW)"
      thoi_gian_gio: 1.5            # ~1.5 giờ đun sôi max công suất
      kwh: 8                        # thực đo ~8 kWh
    - giai_doan: "Ninh liu riu (1 thanh nhiệt chiết áp ~1.3kW)"
      thoi_gian_gio: 18.5           # ~18.5 giờ ninh liu riu
      kwh: 24                       # ~1.3 kW × 18.5h ≈ 24 kWh
  cach_tinh_dien_per_to: "Điện/tô = kwh_per_batch × electricity_unit_price / so_to_thanh_pham"

# -----------------------------------------------------------------------------
# KỸ THUẬT TẠO HƯƠNG & NÊM NẾM (v0.4.0)
# -----------------------------------------------------------------------------
huong_lieu:
  hop_gia_vi_inox:
    cach_dung: "Toàn bộ thảo mộc (quế, hồi, thảo quả...) cho vào hộp inox lưới nhúng trong nồi nước dùng; tuyệt đối KHÔNG thả trực tiếp."
    thoi_gian_nhac_ra_phut: 45       # nhấc hộp gia vị ra sau ~45 phút
    muc_dich: "Nước dùng thanh, không bị nồng/đắng mùi quế hồi"
  phoi_hop_3_lop:                  # định lượng cho mẻ 100L (v1.1.0)
    lop_1_nuong_thom:
      gung_nuong_g: 500
      hanh_kho_nuong_g: 250
      hanh_tay_nuong_g: 200         # 1 củ ~200g
    lop_2_de_tuoi:
      gung_tuoi_g: 300
    lop_3_chung_dau:                # phân bổ cho mẻ 100L (nguồn từ dầu hương vị chưng cất)
      gung_chung_g: 200
      hanh_kho_chung_g: 200
      que_chung_g: 100
      thao_qua_chung_g: 80
  nuoc_mam: "Nước mắm cốt độ đạm cao để tạo vị ngọt hậu tự nhiên"

# -----------------------------------------------------------------------------
# GIÁ VỐN XƯƠNG — TÁCH 2 HỆ SỐ ĐỘC LẬP (ĐC-07)
# -----------------------------------------------------------------------------
xuong_cost_allocation:
  physical_yield_factor: 0.45       # tỷ lệ xác xương thu hồi VẬT LÝ sau ninh (chỉ dùng theo dõi hao hụt vật lý)
  cost_allocation_ratio: 1.0        # 100% chi phí xương mua vào phân bổ vào nồi nước dùng
  cach_tinh_cost_per_to: "Cost xương/tô = (kg_xuong_bo_per_me × giá bò + kg_xuong_heo_per_me × giá heo) × cost_allocation_ratio / so_to_thanh_pham"
  vi_du: "20 kg bò × 60.000 + 5 kg heo × 30.000 → ÷ 140 tô (xem recipe-costing-sample.yaml)"
  ghi_chu: "physical_yield_factor 0.45 chỉ theo dõi hao hụt VẬT LÝ (bã xương bỏ); cost_allocation_ratio 1.0 nghĩa là toàn bộ xương mua vào tính chi phí (không dùng hệ số 0.45 để tính giá vốn)."

# -----------------------------------------------------------------------------
# CỐT TẠO NGỌT TỰ NHIÊN (v1.1.0)
# -----------------------------------------------------------------------------
cot_tao_ngot:
  tom_kho_g: 600                   # tôm khô tạo ngọt hậu tự nhiên
  gung_tuoi_g: 1000                # 1 kg gừng tươi

# -----------------------------------------------------------------------------
# NƯỚC NÈO (NÊM NẾM) — cơ sở 10 L nước dùng (v1.1.0)
# Mẻ 70 L thành phẩm = ×7; chia đều cho 140 tô để tính giá vốn/tô.
# -----------------------------------------------------------------------------
nuoc_neo:
  co_so: "10 lít nước dùng"
  he_so_nhan_70L: 7                # 70 L thành phẩm = 7 × 10 L
  thanh_phan_per_10L:
    mi_chinh_g: 70
    duong_phen_g: 120
    hat_nem_g: 50
    muoi_trang_g: 40
    nuoc_mam_cot_g: 350
  thanh_phan_per_70L:              # = per_10L × 7
    mi_chinh_g: 490
    duong_phen_g: 840
    hat_nem_g: 350
    muoi_trang_g: 280
    nuoc_mam_cot_g: 2450
  cach_ap_dung: "Nêm theo tỷ lệ nước nèo/10L nước dùng; mẻ 70L nhân hệ số 7; chia đều cho 140 tô để tính giá vốn/tô."

# -----------------------------------------------------------------------------
# DẦU HƯƠNG VỊ CHƯNG CẤT — MẺ 5 LÍT (v1.1.0)
# Nguồn cung cấp phần "lớp 3 — chưng dầu" của đồ thơm 3 lớp.
# -----------------------------------------------------------------------------
dau_huong_vi_chung_cat:
  batch: "Mẻ 5 lít dầu ăn"
  nguyen_lieu:
    dau_an_lit: 5
    gung_thai_lat_kg: 1.5          # gừng thái lát mỏng
    hanh_tim_dap_g: 900            # hành tím đập dập
    toi_g: 200                     # tỏi lột vỏ
    que_g: 100                     # quế
    thao_qua_g: 70                 # thảo quả
    hoa_hoi_g: 70                  # hoa hồi
  ky_thuat_nhiet:
    - "Chưng gừng thái lát trước cho đến khi gừng quắt lại"
    - "Sau đó mới thả hành tím đập dập, tỏi, hoa hồi, thảo quả, quế vào chưng tiếp để lấy hương, tránh bị đắng/cháy thảo mộc"
  phan_bo_cho_noi_100L: "1 lít dầu hương vị / mẻ 100L (tức 1/5 mẻ 5L) — giả định v1.1.1, chủ quán chỉnh theo thực tế."
  cost_gia_tham_khao:
    tong_me_5L_vnd: 329000          # dầu 5L×40k + gừng 1,5kg×40k + hành tím 900g×25k + tỏi 200g×50k + quế 100g×120k + thảo quả 70g×200k + hoa hồi 70g×150k
    cost_1_lit_vnd: 65800           # 329.000 ÷ 5
    cost_per_to_vnd: 470            # 65.800 ÷ 140 tô

acceptance:                     # tiêu chuẩn nước dùng đạt
  - "Nước trong vắt"
  - "Thơm lừng, không gây (không mùi hôi bò)"
  - "Ngọt lịm từ xương, không phải từ mì chính"
  - "Mùi quế hồi thanh, không nồng/đắng (nhấc hộp gia vị đúng ~45 phút)"
