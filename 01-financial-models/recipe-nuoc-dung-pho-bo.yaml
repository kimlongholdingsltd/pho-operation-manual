# =============================================================================
# CÔNG THỨC NINH NƯỚC DÙNG — PHỞ BÒ (MẺ CHUẨN 100L)
# Nguồn: 00-raw-notes/Kinh-nghiem-ninh-xuong.md + thông số thực chiến chủ quán
# v0.4.0 — chốt định lượng mẻ chuẩn & điện năng thực đo:
#   - Nồi điện Newsun 100L (công suất max 6kW).
#   - Đầu vào 25 kg xương + 100 L nước → 70 L thành phẩm sau lọc (140 tô × 500 mL).
#   - Điện năng ~32 kWh/mẻ (xem dien_nang bên dưới).
#   - Thay các biến TBD_OWNER_INPUT cũ (v0.3.0) bằng số thực đo.
# Mục đích: tách thông số định lượng (thời gian, nhiệt độ, nguyên liệu, điện) thành
#           biến số để làm cơ sở dữ liệu (bảng recipe, bảng step-timer, bảng cost).
# =============================================================================

meta:
  recipe_id: NUOC-DUNG-PHO-BO-001
  recipe_name: "Nước dùng Phở Bò"
  unit: batch                   # 1 mẻ nước dùng (nồi chuẩn 100L)
  noi_chuan: "Nồi điện Newsun 100L (công suất max 6kW)"
  updated_at: 2026-11-25

ingredients:                    # nguyên liệu làm nước dùng (chưa gồm định lượng bí quyết)
  - "Xương bò (ống + lẫn)"
  - "Mắm, muối, gia vị, mì chính, hạt nêm, đường phèn"
  - "Hành củ"
  - "Củ gừng"
  - "Hành tây"
  - "Quế"
  - "Thảo quả"
  - "Cánh hoa hồi"
  - "Nước mắm cốt độ đạm cao"

# -----------------------------------------------------------------------------
# ĐC-07: LUỒNG SƠ CHẾ XƯƠNG DUY NHẤT (khớp chon-xuong-bo.md & ninh-xuong-bo.md)
# -----------------------------------------------------------------------------
prep_flow_xuong:
  - buoc: "Nhận hàng & kiểm tra tươi"
    noi_dung: "Kiểm tra màu đỏ tươi, xương ống to ~4 đốt ngón tay, nhiều tủy, không mùi hôi (tiêu chí ở ingredients-standards.yaml)"
  - buoc: "Ngâm rửa / chần khử mùi"
    noi_dung: "Chà muối + rượu trắng, ngâm nước vỏ chanh 15–20 phút; hoặc ngâm rửa muối/giấm pha loãng, chần qua nước sôi để loại cặn bẩn"
  - buoc: "Nướng xương (nếu áp dụng)"
    noi_dung: "Nướng bếp gas/than, nồi chiên không dầu hoặc lò nướng 200–230°C trong 15–20 phút đến cháy xém, chảy mỡ thừa"
  - buoc: "Vào nồi ninh"
    noi_dung: "Rửa lại sạch, cho vào nồi nước, đun vừa để vớt bọt rồi ninh liu riu (xem process bên dưới)"

process:
  - step: 1
    name: "Rửa & khử mùi xương"
    detail: "Rửa sạch, chà xát muối + rượu trắng, ngâm nước vỏ chanh"
    time_min: { min: 15, max: 20 }
  - step: 2
    name: "Nướng xương"
    detail: "Nướng trên bếp gas/than, nồi chiên không dầu hoặc lò nướng đến cháy xém, chảy mỡ thừa"
    temp_c: { min: 200, max: 230 }
    time_min: { min: 15, max: 20 }
  - step: 3
    name: "Rửa lại & hầm sơ, vớt bọt"
    detail: "Rửa lại sạch, cho xương vào nồi nước, đun nhiệt cao vừa phải để bọt nổi lên, vớt sạch bọt (không để bọt tan vào nước). NGAY SAU KHI vớt sạch bọt đợt đầu thì cho thịt nạm/gầu vào luộc."
  - step: 4
    name: "Ninh xương"
    detail: "Ninh sôi liu riu (mặt nước sôi lăn tăn, không sôi sùng sục); duy trì suốt ~20 tiếng, châm bù bằng nước sôi khi cạn dưới xương."
    time_hour: 20
  - step: 5
    name: "Luộc thịt nạm/gầu"
    detail: "Thịt cho vào ngay sau khi vớt sạch bọt đợt đầu, luộc 2.5–3 giờ đến chín mềm rồi vớt; để nguội tự nhiên (kiểm soát thời gian/nhiệt độ tránh vùng nguy cơ), chia túi/hộp → ngăn đông mềm (bán hôm sau) hoặc cấp đông sâu (dài ngày)."
    time_hour: { min: 2.5, max: 3 }
  - step: 6
    name: "Làm nước lèo (tạo hương & nêm gia vị)"
    detail: "Dùng hộp gia vị inox: toàn bộ thảo mộc (quế, hồi, thảo quả...) cho vào hộp inox lưới nhúng trong nồi, KHÔNG thả trực tiếp; nhấc hộp ra sau ~45 phút để nước thanh, không nồng/đắng mùi quế hồi. Phối hợp hương liệu 3 lớp (xem huong_lieu). Nêm bằng nước mắm cốt độ đạm cao."
  - step: 7
    name: "Chuẩn bị bán hàng"
    detail: "Chuẩn bị thịt, rau thơm, bánh phở để bán; ra tô chuẩn 500 mL nước dùng/tô (xem 03-sop-operations/ra-to-va-giu-nhiet.md)."

# -----------------------------------------------------------------------------
# ĐỊNH MỨC MẺ CHUẨN (v0.4.0 — số thực đo, thay TBD_OWNER_INPUT cũ)
# -----------------------------------------------------------------------------
batch_spec:
  noi_chuan: "Nồi điện Newsun 100L (công suất max 6kW)"
  kg_xuong_per_me: 25               # 25 kg xương ống/xương cục
  lit_nuoc_dau_vao: 100             # 100 lít nước ban đầu
  lit_thanh_pham_sau_loc: 70        # 70 lít nước dùng bán được sau lọc
  so_to_thanh_pham: 140             # 70 L ÷ 0.5 L/tô = 140 tô chuẩn
  ty_le_xuong_nuoc: 0.25            # 25 kg / 100 L = 0.25 kg xương / lít nước đầu vào
  dinh_muc_ml_nuoc_dung_per_to: 500 # 500 mL nước dùng/tô
  gram_xuong_per_to: 178.6          # 25,000 g / 140 tô

# -----------------------------------------------------------------------------
# ĐIỆN NĂNG MẺ NINH (nồi Newsun 100L)
# -----------------------------------------------------------------------------
dien_nang:
  noi: "Nồi điện Newsun 100L — công suất max 6kW"
  kwh_per_batch: 32                 # tổng điện năng ~32 kWh/mẻ ninh 20 giờ
  electricity_unit_price: TBD_OWNER_INPUT   # VND/kWh — bậc giá điện kinh doanh khu vực (chủ quán điền)
  don_vi_gia_dien: "VND/kWh"
  breakdown:
    - giai_doan: "Đun sôi ban đầu (max 6kW)"
      thoi_gian_gio: 1.5            # ~1.5 giờ đun sôi max công suất
      kwh: 8                        # thực đo ~8 kWh
    - giai_doan: "Ninh liu riu (1 thanh nhiệt chiết áp ~1.3kW)"
      thoi_gian_gio: 18.5           # ~18.5 giờ ninh liu riu
      kwh: 24                       # ~1.3 kW × 18.5h ≈ 24 kWh
  cach_tinh_dien_per_to: "Điện/tô = kwh_per_batch × electricity_unit_price / so_to_thanh_pham"

# -----------------------------------------------------------------------------
# KỸ THUẬT TẠO HƯƠNG & NÊM NẾM (v0.4.0)
# -----------------------------------------------------------------------------
huong_lieu:
  hop_gia_vi_inox:
    cach_dung: "Toàn bộ thảo mộc (quế, hồi, thảo quả...) cho vào hộp inox lưới nhúng trong nồi nước dùng; tuyệt đối KHÔNG thả trực tiếp."
    thoi_gian_nhac_ra_phut: 45       # nhấc hộp gia vị ra sau ~45 phút
    muc_dich: "Nước dùng thanh, không bị nồng/đắng mùi quế hồi"
  phoi_hop_3_lop:
    lop_1: "Gừng, hành tây, quế hồi nướng thơm trước khi cho vào hộp"
    lop_2: "Một phần gia vị để tươi (không nướng) cho cùng vào hộp để giữ hậu vị tươi"
    lop_3: "Hương vị chưng cất cùng dầu ăn (dầu điều/mỡ hành gia vị chưng) để tạo độ béo và dậy mùi đặc trưng"
  nuoc_mam: "Nước mắm cốt độ đạm cao để tạo vị ngọt hậu tự nhiên"

# -----------------------------------------------------------------------------
# GIÁ VỐN XƯƠNG — PHÂN BỔ THEO MẺ THỰC ĐO (thay hệ số 0.45 cũ của ĐC-08)
# -----------------------------------------------------------------------------
xuong_cost_allocation:
  cach_tinh_cost_per_to: "Cost xương/tô = kg_xuong_per_me × giá/kg / so_to_thanh_pham"
  vi_du: "25 kg × 60.000 VND/kg ÷ 140 tô = 10.714 VND/tô"
  ghi_chu: "v0.4.0 thay hệ số ước 0.45 (ĐC-08) bằng số mẻ thực đo; toàn bộ 25 kg xương mua vào được phân bổ 100% chi phí vào nước dùng."

acceptance:                     # tiêu chuẩn nước dùng đạt
  - "Nước trong vắt"
  - "Thơm lừng, không gây (không mùi hôi bò)"
  - "Ngọt lịm từ xương, không phải từ mì chính"
  - "Mùi quế hồi thanh, không nồng/đắng (nhấc hộp gia vị đúng ~45 phút)"
