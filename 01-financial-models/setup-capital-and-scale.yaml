meta:
  schema_version: "1.0"
  category: setup_capital_scale
  currency: VND
  updated_at: 2026-11-25

quy_mo:
  quan_nho:
    seats: { min: 10, max: 20 }
  quan_gia_dinh:
    seats: { min: 30, max: 50 }
    capital_million: { min: 150, max: 300 }
  quan_lon_mat_pho:
    seats: { min: 60, max: 100 }
    capital_million:
      min: 300
      recommended_max: 500          # ĐC-09: gợi ý, không phải trần cứng (quán lớn hơn vẫn được)

# -----------------------------------------------------------------------------
# ĐC-03 & ĐC-04: 4 khoản vốn tách bạch
# -----------------------------------------------------------------------------
von_4_khoan:
  tien_coc_thue_nha:
    label: "Tiền cọc thuê nhà"
    ban_chat: "Khoản thế chấp, HOÀN LẠI khi hết hợp đồng (không phải chi phí chìm)"
    thang_tien_thue: { min: 1, max: 3 }   # tương đương 1–3 tháng tiền thuê (cac-buoc-cbi-co-ban)
  tien_thue_tra_truoc_ky_dau:
    label: "Tiền thuê trả trước kỳ đầu"
    ban_chat: "Chi phí trả trước, phân bổ dần theo kỳ thuê"
    thang_tien_thue: { min: 2, max: 3 }   # "cọc + 2–3 tháng đầu" (nguyen-tac-chon-vi-tri)
  du_phong_thi_cong_mua_sam:
    label: "Dự phòng phát sinh thi công / mua sắm"
    ban_chat: "Dự phòng CAPEX cho phát sinh cải tạo, thiết bị"
    percent_capex: { min: 5, max: 10 }    # 5–10% CAPEX (dieu-kien-tien-quyet)
  quy_tien_mat_van_hanh:
    label: "Quỹ tiền mặt duy trì vận hành"
    ban_chat: "Dự phòng chịu lỗ giai đoạn đầu (thuê, điện nước, lương, nguyên liệu)"
    thang_chi_phi_co_dinh_toi_thieu: 3    # tối thiểu 3 tháng chi phí cố định (chua-co-thuong-hieu)

phan_bo_ngan_sach_thu_tu_uu_tien:
  - "Mặt bằng và sửa chữa (phần lớn)"
  - "Thiết bị – nội thất"
  - "Nguyên liệu ban đầu"
  - "Marketing khai trương"
  - "Quỹ dự phòng vận hành"

nha_cung_cap:
  so_luong_toi_thieu_nguyen_lieu_chinh: 2    # "ít nhất 2 nhà cung cấp" cho nguyên liệu chính

tham_khao_goc_raw_notes:
  quan_binh_dan_toi_thieu_million: 100       # "từ khoảng 100 triệu đồng trở lên" (cac-buoc-cbi-co-ban)
  quy_du_phong_van_hanh_thang_goc: { min: 2, max: 6 }   # (cac-buoc-cbi-co-ban) — v0.3.0 chốt tối thiểu 3 tháng
  quy_du_phong_online_offline_thang: { min: 2, max: 3 }  # (ban-online-offline)
